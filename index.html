<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>رتّب مكتبك</title>
<meta name="description" content="رتّب مكتبك: خطّط مكتبك بشكل ثلاثي الأبعاد وبالمقاسات الحقيقية قبل الشراء. Plan your desk setup in 3D at true scale.">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<script src="js/theme-init.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="scene"></canvas>

<div class="stage-ui">
  <div class="topbar">
    <div class="viewbar floating" role="group" id="viewbar">
      <button type="button" data-view="angle" data-i18n="viewAngle"></button>
      <button type="button" data-view="front" data-i18n="viewFront"></button>
      <button type="button" data-view="top" data-i18n="viewTop"></button>
      <button type="button" data-view="side" data-i18n="viewSide"></button>
    </div>
    <div class="histbar floating" role="group">
      <button type="button" data-h="undo" id="undoBtn" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
      <button type="button" data-h="redo" id="redoBtn" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
      <button type="button" data-h="help" id="helpBtn">?</button>
    </div>
    <button class="icon-btn floating stage-action" type="button" id="fitBtn" data-i18n="fitAll"></button>
    <button class="icon-btn floating stage-action" type="button" id="openBtn" data-i18n="openFile"></button>
    <div class="export-wrap">
      <button class="export-btn floating" type="button" id="exportBtn" aria-expanded="false" aria-controls="exportMenu">
        <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M4 20h16"/></svg>
        <span class="lbl" data-i18n="export"></span>
      </button>

    </div>
  </div>
  <div class="hint" id="hint"></div>
  <button type="button" class="warn" id="warnChip" hidden></button>
  <div class="toast" id="toast" role="status" hidden></div>


</div>



<div class="modal-back" id="exportBack" hidden>      <div class="export-menu modal floating" id="exportMenu" role="dialog" aria-modal="true" aria-labelledby="exportTitle" hidden>
        <div class="modal-head"><h2 id="exportTitle" data-i18n="export"></h2><button class="icon-btn" type="button" id="exportClose" data-i18n="close"></button></div>
        <p class="export-intro" data-i18n="exportIntro"></p>
        <button type="button" data-exp="png"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg><span><b data-i18n="expPng"></b><small data-i18n="expPngSub"></small></span></button>
        <div class="res-row" id="resRow" role="group"><button type="button" data-res="1920">1920×1080</button><button type="button" data-res="2560" aria-pressed="true">2560×1440</button><button type="button" data-res="3840">3840×2160</button></div>
        <button type="button" data-exp="report"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><rect x="6" y="6" width="7" height="5" rx="1"/><path d="M15.5 7h2.5M15.5 10h2.5M6 14.5h12M6 17.5h8"/></svg><span><b data-i18n="expReport"></b><small data-i18n="expReportSub"></small></span></button>
        <button type="button" data-exp="xlsx"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18"/></svg><span><b data-i18n="expExcel"></b><small data-i18n="expExcelSub"></small></span></button>
        <button type="button" data-exp="json"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M10 13l-2 2 2 2M14 13l2 2-2 2"/></svg><span><b data-i18n="expJson"></b><small data-i18n="expJsonSub"></small></span></button>
        <input type="file" id="importInput" accept=".json,application/json" hidden>
        <button type="button" class="btn" id="downloadBtn" data-i18n="download"></button>
        <div class="exp-status" id="expStatus" role="status"></div>
      </div></div>

<div class="modal-back" id="helpBack" hidden>
  <div class="modal floating" role="dialog" aria-modal="true" aria-labelledby="helpTitle">
    <div class="modal-head"><h2 id="helpTitle" data-i18n="shortcuts"></h2><button class="icon-btn" type="button" id="helpClose" data-i18n="close"></button></div>
    <div id="helpBody"></div>
  </div>
</div>

<aside class="panel" id="panel">
  <button class="sheet-toggle" id="panelToggle" type="button" aria-expanded="false" aria-controls="panelBody"><span data-i18n="menu"></span><span id="sheetState"></span></button>
  <div class="panel-body" id="panelBody">
  <div class="brand">
    <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="11" rx="1.5"/><path d="M2 20h20M12 15v5"/></svg></div>
    <div class="brand-text"><h1 data-i18n="appTitle"></h1><p data-i18n="appSub"></p></div>
    <div class="toggles">
      <button class="icon-btn lang" type="button" id="langBtn"></button>
      <button class="icon-btn" type="button" id="themeBtn"></button>
      <button class="icon-btn panel-close" type="button" id="panelClose" data-i18n-aria="close">×</button>
    </div>
  </div>
  <div class="editor" id="editor" hidden>
    <div class="editor-head"><h3 id="editorTitle"></h3><button class="icon-btn" type="button" id="editorClose" data-i18n="back"></button></div>
  <div class="inspector" id="insp" hidden>
    <div class="insp-info"><div class="insp-name" id="inspName"></div><div class="insp-meta" id="inspMeta"></div><div class="insp-edges" id="inspEdges"></div></div>
    <div class="insp-actions">
      <button class="icon-btn" type="button" data-act="focus" data-i18n-aria="focusItem">◎</button>
      <button class="icon-btn" type="button" data-act="rotl" data-i18n-aria="rotL"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg></button>
      <button class="icon-btn" type="button" data-act="rotr" data-i18n-aria="rotR"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg></button>
      <button class="icon-btn" type="button" data-act="dup" data-i18n-aria="dup"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M4 16V6a2 2 0 0 1 2-2h10"/></svg></button>
      <button class="icon-btn danger" type="button" data-act="del" data-i18n-aria="del"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>
    </div>
  </div>
    <p class="save-note" data-i18n="autoSaved"></p>
    <div id="editorFields"></div>
  </div>


  <div class="tabs" role="tablist">
    <button role="tab" id="tab-desk" aria-controls="p-desk" type="button"><span data-i18n="tabDesk"></span></button>
    <button role="tab" id="tab-add" aria-controls="p-add" type="button"><span data-i18n="tabAdd"></span></button>
    <button role="tab" id="tab-items" aria-controls="p-items" type="button"><span data-i18n="tabItems"></span><span class="count" id="itemCount">0</span></button>
  </div>

  <div class="tabpanel" id="p-add" role="tabpanel">
    <div class="section-title" data-i18n="devices"></div>
    <div class="kind-grid" id="kindGrid"></div>
    <div class="section-title accessory-label" data-i18n="accessories"></div>
    <div class="kind-grid" id="extraGrid"></div>
    <div class="fields" id="addFields"></div>
  </div>
  <div class="tabpanel" id="p-items" role="tabpanel" hidden>
    <div class="item-list" id="itemList"></div>
    <div class="list-actions" id="listActions">
      <button class="btn-ghost" type="button" id="arrangeBtn" data-i18n="arrange"></button>
      <button class="btn-ghost danger" type="button" id="clearBtn" data-i18n="clearAll"></button>
    </div>
  </div>
  <div class="tabpanel" id="p-desk" role="tabpanel" hidden>
    <div class="welcome" id="welcome" hidden><p data-i18n="welcomeText"></p><button type="button" class="btn-ghost" id="welcomeClose" data-i18n="gotIt"></button></div>
    <div id="deskFields"></div>
  </div>

  <div class="panel-foot" id="addFoot">
    <button class="btn" id="addBtn" type="button"></button>
    <div class="error" id="addErr" role="alert"></div>
  </div>
  <p class="disclaimer" data-i18n="disclaimer"></p>
  </div>
</aside>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
